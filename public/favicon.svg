<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#f39223" />
      <stop offset="100%" stop-color="#d94e08" />
    </linearGradient>
    <linearGradient id="capGleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Squircle App Container -->
  <rect width="64" height="64" rx="16" fill="url(#brandGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1" />

  <!-- Graduation Cap & Sparkle Group -->
  <g filter="url(#softShadow)">
    <!-- Little Sparkle -->
    <path
      d="M48 11 C48 14 51 15 53 16 C51 17 48 18 48 21 C48 18 45 17 43 16 C45 15 48 14 48 11 Z"
      fill="url(#capGleam)"
      opacity="0.95"
    />

    <!-- Graduation Cap Symbol -->
    <g transform="translate(10, 11) scale(1.85)" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Diamond / Mortarboard Top -->
      <polygon
        points="12,4.8 21.5,9.2 12,13.6 2.5,9.2"
        fill="#ffffff"
        fill-opacity="0.22"
        stroke="#ffffff"
      />
      <!-- Cap Neck / Crown -->
      <path d="M6 12.5 V16.2 C6 18.8 8.7 20.2 12 20.2 C15.3 20.2 18 18.8 18 16.2 V12.5" />
      <!-- Tassel -->
      <path d="M21.5 9.5 V16.5" />
      <circle cx="21.5" cy="16.8" r="0.8" fill="#ffffff" stroke="none" />
    </g>
  </g>
</svg>